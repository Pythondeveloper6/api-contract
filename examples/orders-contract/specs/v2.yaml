openapi: 3.0.3
info: {title: Shop API, version: "2"}
paths:
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  total: {type: string}
                  status: {type: string, enum: [new, paid]}
